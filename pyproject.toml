[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storeops"
version = "0.1.0"
description = "StoreOps retail operations REST API (stub scaffold)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "pytest-cov>=5",
    "pylint>=3",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storeops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --cov=storeops --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/storeops"]
branch = true

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pylint.main]
py-version = "3.14"
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 100

[tool.importlinter]
root_package = "storeops"

[[tool.importlinter.contracts]]
name = "Per-module layer separation"
type = "layers"
layers = ["routes", "service", "repository"]
containers = [
    "storeops.activities",
    "storeops.programmes",
    "storeops.staff",
    "storeops.alerts",
    "storeops.reports",
]

[[tool.importlinter.contracts]]
name = "No cross-module import of activities.repository"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = [
    "storeops.programmes",
    "storeops.staff",
    "storeops.alerts",
    "storeops.reports",
]
forbidden_modules = ["storeops.activities.repository"]

[[tool.importlinter.contracts]]
name = "No cross-module import of programmes.repository"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = [
    "storeops.activities",
    "storeops.staff",
    "storeops.alerts",
    "storeops.reports",
]
forbidden_modules = ["storeops.programmes.repository"]

[[tool.importlinter.contracts]]
name = "No cross-module import of staff.repository"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = [
    "storeops.activities",
    "storeops.programmes",
    "storeops.alerts",
    "storeops.reports",
]
forbidden_modules = ["storeops.staff.repository"]

[[tool.importlinter.contracts]]
name = "No cross-module import of alerts.repository"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = [
    "storeops.activities",
    "storeops.programmes",
    "storeops.staff",
    "storeops.reports",
]
forbidden_modules = ["storeops.alerts.repository"]

[[tool.importlinter.contracts]]
name = "No cross-module import of reports.repository"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = [
    "storeops.activities",
    "storeops.programmes",
    "storeops.staff",
    "storeops.alerts",
]
forbidden_modules = ["storeops.reports.repository"]

[[tool.importlinter.contracts]]
name = "No direct side-effect imports from activities/programmes into alerts/reports services"
type = "forbidden"
allow_indirect_imports = "True"
source_modules = [
    "storeops.activities",
    "storeops.programmes",
]
forbidden_modules = [
    "storeops.alerts.service",
    "storeops.reports.service",
]
