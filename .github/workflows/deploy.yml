name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write # for AWS OIDC role assumption
  contents: read

env:
  AWS_REGION: us-east-1
  APP_NAME: storeops
  EB_ENVIRONMENT_NAME: storeops-env

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        # Python version comes from the committed .python-version file (3.14) —
        # uv reads it automatically and installs that Python itself on `uv sync`.

      - name: Install dependencies
        run: uv sync

      - name: mypy
        run: uv run mypy src

      - name: pylint
        run: uv run pylint src

      - name: import-linter
        run: uv run lint-imports

      - name: pytest (with coverage)
        run: uv run pytest

      - name: Per-layer coverage thresholds
        run: uv run python scripts/check_coverage.py

  deploy:
    needs: test
    # Skip gracefully (instead of failing) until the AWS OIDC role is set up —
    # add the AWS_DEPLOY_ROLE_ARN repo secret to enable actual deploys.
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      secrets.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$ECR_REGISTRY/$APP_NAME:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render Dockerrun.aws.json
        run: |
          sed "s#__ECR_IMAGE__#${{ steps.build.outputs.image }}#" Dockerrun.aws.json > Dockerrun.aws.json.rendered
          mv Dockerrun.aws.json.rendered Dockerrun.aws.json

      - name: Zip deployment bundle
        run: zip -r deploy.zip Dockerrun.aws.json

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          # Credentials come from the OIDC role assumed above (configure-aws-credentials
          # exports these as job env vars) — nothing hardcoded, no long-lived secrets.
          aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }}
          application_name: ${{ env.APP_NAME }}
          environment_name: ${{ env.EB_ENVIRONMENT_NAME }}
          region: ${{ env.AWS_REGION }}
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
